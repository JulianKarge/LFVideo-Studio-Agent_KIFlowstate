<!doctype html>
<html
  lang="de"
  data-composition-variables='[
    {"id":"name","type":"string","label":"Name","default":"Lena Berg","placeholder":"Vorname Nachname"},
    {"id":"role","type":"string","label":"Rolle","default":"Fotografin und Kursleiterin","placeholder":"Funktion oder Beschreibung"},
    {"id":"tag","type":"string","label":"Tag","default":"fjordlicht.example","placeholder":"Website, Handle oder Ort"},
    {"id":"showBackdrop","type":"boolean","label":"Demo-Hintergrund zeigen","default":true}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Lower Third (Sprecherkarte)</title>
    <!-- brand-tokens:start (erzeugt von scripts/build-tokens.mjs, nicht von Hand aendern) -->
    <style id="brand-tokens">
      /* Erzeugt von scripts/build-tokens.mjs aus brand/tokens.json. Nicht von Hand aendern. */
      /* Marke: Fjordlicht (Demo-Marke) */
      :root {
        --color-bg: #0E1A22;
        --color-surface: #16262F;
        --color-surface-2: #1F3440;
        --color-text: #F2F5F7;
        --color-muted: #9FB1BC;
        --color-accent: #F5A524;
        --color-accent-2: #3FB8AF;
        --color-on-accent: #0E1A22;
        --color-line: #2C4452;
        --font-display: "Outfit", system-ui, sans-serif;
        --font-body: "Inter", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", system-ui, sans-serif;
        --radius-sm: 12px;
        --radius-md: 24px;
        --radius-lg: 40px;
        --space-xs: 8px;
        --space-sm: 16px;
        --space-md: 32px;
        --space-lg: 64px;
        --space-xl: 96px;
        --type-display: 96px;
        --type-h1: 72px;
        --type-h2: 48px;
        --type-body: 32px;
        --type-small: 24px;
        --type-weight-display: 700;
        --type-weight-body: 400;
        --type-letter-spacing-display: -0.02em;
        --motion-fps: 30;
        --motion-ease-in: "power3.in";
        --motion-ease-out: "power3.out";
        --motion-ease-move: "power2.inOut";
        --motion-duration-fast: 0.25s;
        --motion-duration-base: 0.6s;
        --motion-duration-slow: 1.1s;
        --video-width: 1920px;
        --video-height: 1080px;
      }
    </style>
    <!-- brand-tokens:end -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /*
        Alle Farben, Schriften, Radien und Abstaende kommen aus dem Token-Block oben (erzeugt aus brand/tokens.json).
        Hier stehen nur Layout und Struktur. Keine Literalfarben ausser rgba(0,0,0,x) fuer Schatten.
      */
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      body {
        font-family: var(--font-body);
        font-weight: var(--type-weight-body);
        color: var(--color-text);
        /* Kein Body-Hintergrund: damit bleibt ein WebM-Render ohne Backdrop transparent. */
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Demo-Hintergrund (Kamera-Platzhalter). Nicht getimt, wird vor dem Timeline-Aufbau per Klasse geschaltet. */
      #backdrop {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, var(--color-bg) 0%, var(--color-surface-2) 100%);
      }
      #backdrop.is-hidden {
        display: none;
      }
      #backdrop-label {
        position: absolute;
        left: var(--space-xl);
        top: var(--space-lg);
        font-family: var(--font-mono);
        font-size: var(--type-small);
        line-height: 1.2;
        letter-spacing: 0.04em;
        color: var(--color-muted);
      }

      /* Die Sprecherkarte: unten links, Ankerpunkt x = 128px, Unterkante y = 1080 - 128px. */
      #card {
        position: absolute;
        left: 128px;
        bottom: 128px;
        width: auto;
        max-width: 1100px;
      }

      #card-panel {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-xs);
        width: max-content;
        max-width: 1100px;
        padding: calc(var(--space-md) + var(--space-xs)) calc(var(--space-md) + var(--space-xs)) var(--space-md);
        background: var(--color-surface);
        border: 1px solid var(--color-line);
        border-radius: var(--radius-md);
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.25);
        overflow: hidden;
      }

      /* Akzentbalken: laeuft als Oberkante der Karte von links nach rechts auf. */
      #card-bar {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: var(--space-xs);
        background: var(--color-accent);
        transform-origin: left center;
      }

      #card-name {
        margin: 0;
        font-family: var(--font-display);
        font-size: var(--type-h1);
        font-weight: var(--type-weight-display);
        letter-spacing: var(--type-letter-spacing-display);
        line-height: 1.1;
        color: var(--color-text);
        white-space: nowrap;
      }

      #card-role {
        margin: 0;
        font-family: var(--font-body);
        font-size: var(--type-body);
        font-weight: var(--type-weight-body);
        line-height: 1.3;
        color: var(--color-muted);
        white-space: nowrap;
      }

      #card-chip {
        display: flex;
        align-items: center;
        gap: var(--space-xs);
        width: max-content;
        margin-top: var(--space-xs);
        padding: calc(var(--space-xs) * 0.75) var(--space-sm);
        border: 2px solid var(--color-accent-2);
        border-radius: var(--radius-sm);
        background: var(--color-surface-2);
        font-family: var(--font-mono);
        /* Leicht ueber --type-small, damit der Tag auch auf kleinen Bildschirmen lesbar bleibt (Lesefloor 28 px bei 1080p). */
        font-size: calc(var(--type-small) * 1.2);
        line-height: 1.2;
        color: var(--color-text);
        white-space: nowrap;
      }
      #card-chip-dot {
        display: block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--color-accent-2);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="lower-third" data-start="0" data-width="1920" data-height="1080" data-duration="8">
      <!-- Demo-Hintergrund: steht fuer das spaetere Kamerabild. Per Variable showBackdrop abschaltbar. -->
      <div id="backdrop" aria-hidden="true">
        <span id="backdrop-label" data-layout-ignore>Kamera-Platzhalter</span>
      </div>

      <!-- Sprecherkarte: Clip von 0.3 s bis 7.8 s. Animiert werden nur Kind-Elemente. -->
      <section id="card" class="clip" data-start="0.3" data-duration="7.5" data-track-index="1" data-hold>
        <div id="card-panel">
          <div id="card-bar"></div>
          <h1 id="card-name" data-var-text="name">Lena Berg</h1>
          <p id="card-role" data-var-text="role">Fotografin und Kursleiterin</p>
          <div id="card-chip">
            <span id="card-chip-dot"></span>
            <span id="card-tag" data-var-text="tag">fjordlicht.example</span>
          </div>
        </div>
      </section>
    </div>

    <script>
      (function () {
        // 1) Variablen einmalig lesen. Fehlt die API (z. B. Datei direkt im Browser geoeffnet), gelten die Standardwerte.
        var vars = {};
        try {
          if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
            vars = window.__hyperframes.getVariables() || {};
          }
        } catch (err) {
          vars = {};
        }
        var showBackdrop = vars.showBackdrop;
        var backdropOff = showBackdrop === false || showBackdrop === "false" || showBackdrop === 0 || showBackdrop === "0";
        if (backdropOff) {
          document.getElementById("backdrop").classList.add("is-hidden");
        }

        // 2) Zeitplan. Einblenden 0.3 s bis 1.5 s, lesbar bis EXIT_START, ausblenden bis 7.7 s. Root ist 8 s lang.
        //    Willst du die Karte laenger stehen lassen: EXIT_START erhoehen, data-duration am Root und am #card-Clip anpassen.
        var ENTER_START = 0.3;
        var EXIT_START = 6.6;
        var EASE_IN = "power3.out";
        var EASE_OUT = "power3.in";

        var tl = gsap.timeline({ paused: true });

        // Einblenden: Karte, Akzentbalken, Name, Rolle, Tag-Chip.
        tl.fromTo("#card-panel", { opacity: 0, x: -32 }, { opacity: 1, x: 0, duration: 0.5, ease: EASE_IN }, ENTER_START);
        tl.fromTo("#card-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: EASE_IN, transformOrigin: "left center" }, ENTER_START + 0.1);
        tl.fromTo("#card-name", { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: EASE_IN }, ENTER_START + 0.3);
        tl.fromTo("#card-role", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: EASE_IN }, ENTER_START + 0.5);
        tl.fromTo("#card-chip", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: EASE_IN }, ENTER_START + 0.7);

        // Ausblenden in umgekehrter Reihenfolge: Chip, Rolle, Name, Balken, Karte. Fertig bei EXIT_START + 1.1 s.
        tl.to("#card-chip", { y: 12, opacity: 0, duration: 0.3, ease: EASE_OUT }, EXIT_START);
        tl.to("#card-role", { y: 12, opacity: 0, duration: 0.3, ease: EASE_OUT }, EXIT_START + 0.12);
        tl.to("#card-name", { y: 16, opacity: 0, duration: 0.35, ease: EASE_OUT }, EXIT_START + 0.24);
        tl.to("#card-bar", { scaleX: 0, duration: 0.4, ease: EASE_OUT, transformOrigin: "left center" }, EXIT_START + 0.4);
        tl.to("#card-panel", { opacity: 0, x: -24, duration: 0.4, ease: EASE_OUT }, EXIT_START + 0.7);

        window.__timelines["lower-third"] = tl;
      })();
    </script>
  </body>
</html>

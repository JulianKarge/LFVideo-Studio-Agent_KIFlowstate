<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Mini-Render Funktionstest</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Funktionstest fuer check-setup.mjs --render. Absichtlich ohne Marken-Tokens:
         hier geht es nur darum, ob Hyperframes auf diesem Rechner ein MP4 erzeugt. */
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #1c1c1c;
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, system-ui, sans-serif;
        color: #f4f4f4;
      }
      #card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
      }
      #ring {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        border: 14px solid #f4f4f4;
        border-top-color: #8a8a8a;
      }
      #label {
        font-size: 56px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="mini-render" data-start="0" data-width="1920" data-height="1080" data-duration="2">
      <section id="card" class="clip" data-start="0" data-duration="2" data-track-index="0">
        <div id="ring"></div>
        <div id="label">Dein Studio rendert.</div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#ring", { rotation: 0 }, { rotation: 360, duration: 2, ease: "none" }, 0);
      tl.fromTo("#label", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.3);
      window.__timelines["mini-render"] = tl;
    </script>
  </body>
</html>
